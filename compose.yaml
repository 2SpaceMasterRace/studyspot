name: studyspot

services:
  frontend:
    build:
      context: ./src/frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:7500:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:5173').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ./src/frontend/src
          target: /app/src
        - action: sync
          path: ./src/frontend/static
          target: /app/static
        - action: sync+restart
          path: ./src/frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./src/frontend/package.json
        - action: rebuild
          path: ./src/frontend/bun.lock
        - action: rebuild
          path: ./src/frontend/Dockerfile

  backend:
    build:
      context: ./src/backend
    environment:
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-file:/app/.local/studyspot.db}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      MEILISEARCH_URL: http://meilisearch:7700
    ports:
      - "127.0.0.1:7501:8000"
    volumes:
      - turso-data:/app/.local
    command:
      - uv
      - run
      - --frozen
      - uvicorn
      - studyspot_api.main:app
      - --app-dir
      - src
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    depends_on:
      meilisearch:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ./src/backend/src
          target: /app/src
        - action: rebuild
          path: ./src/backend/pyproject.toml
        - action: rebuild
          path: ./src/backend/uv.lock
        - action: rebuild
          path: ./src/backend/Dockerfile

  meilisearch:
    image: getmeili/meilisearch:v1.45.1
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7502:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  turso-data:
  meilisearch-data:
