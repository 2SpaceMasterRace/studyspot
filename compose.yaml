name: studyspot

services:
  frontend:
    build:
      context: ./src/frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:7500:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:5173').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ./src/frontend/src
          target: /app/src
        - action: sync
          path: ./src/frontend/static
          target: /app/static
        - action: sync+restart
          path: ./src/frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./src/frontend/package.json
        - action: rebuild
          path: ./src/frontend/bun.lock
        - action: rebuild
          path: ./src/frontend/Dockerfile

  backend:
    build:
      context: ./src/backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://studyspot:studyspot@postgres:5432/studyspot}
      DJANGO_DEBUG: "true"
      MEILISEARCH_URL: http://meilisearch:7700
    ports:
      - "127.0.0.1:7501:8000"
    # Migrations run before the server so that `docker compose up` on a fresh
    # volume serves a working API rather than 503s until someone remembers.
    command:
      - sh
      - -c
      - |
        uv run --frozen python manage.py migrate --no-input
        exec uv run --frozen python manage.py runserver 0.0.0.0:8000
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    develop:
      watch:
        - action: sync
          path: ./src/backend/studyspot
          target: /app/studyspot
        - action: sync
          path: ./src/backend/spots
          target: /app/spots
        - action: rebuild
          path: ./src/backend/pyproject.toml
        - action: rebuild
          path: ./src/backend/uv.lock
        - action: rebuild
          path: ./src/backend/Dockerfile

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: studyspot
      POSTGRES_PASSWORD: studyspot
      POSTGRES_DB: studyspot
    # Published so that `just dev-backend` and `just test` outside Compose reach
    # the same database the containers use.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The database name is given explicitly: without it pg_isready checks the
      # user's default database, which during initialization is not yet ready.
      test: ["CMD-SHELL", "pg_isready --username=studyspot --dbname=studyspot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  meilisearch:
    image: getmeili/meilisearch:v1.45.1
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7502:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  meilisearch-data:
